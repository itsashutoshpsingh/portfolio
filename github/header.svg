<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="t"><style>
  :root { --bg:#0d1117; --card:#161b22; --line:rgba(255,255,255,.12); --fg:#e6edf3; --muted:#8b949e; --signal:#5ba8ff; --ok:#4fd8a0; }
  @media (prefers-color-scheme: light) { :root { --bg:#ffffff; --card:#f6f8fa; --line:rgba(0,0,0,.1); --fg:#1f2328; --muted:#656d76; --signal:#1f63e0; --ok:#1a7f4b; } }
  text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .card { fill: var(--card); stroke: var(--line); }
  .fg { fill: var(--fg); } .muted { fill: var(--muted); } .signal { fill: var(--signal); } .ok { fill: var(--ok); }
  .rise { opacity: 0; animation: rise .8s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .rise, .draw, .pulse, .chip { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }

  .draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 2.2s cubic-bezier(.22,1,.36,1) .3s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pulse { transform-origin: 47px 208px; animation: pulse 2.4s cubic-bezier(.22,1,.36,1) 1.4s 3; }
  @keyframes pulse { 0% { opacity:1; } 50% { opacity:.3; } 100% { opacity:1; } }
</style>
<title id="t">Ashutosh Pal Singh, security analyst</title>
