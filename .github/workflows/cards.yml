name: Refresh README cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "github/fonts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contributions and repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github.py
      - name: Render cards
        run: python scripts/render_cards.py
      - name: Commit if changed
        run: |
          git config user.name "Ashutosh Pal Singh"
          git config user.email "itsashutoshpsingh@gmail.com"
          git add data/github.json github/cards
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
