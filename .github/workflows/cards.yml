name: Refresh README cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render_cards.py", "research/data/projects.json", "github/fonts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        run: python scripts/render_cards.py
      - name: Commit if changed
        run: |
          git config user.name "Ashutosh Pal Singh"
          git config user.email "283610179+itsashutoshpsingh@users.noreply.github.com"
          git add -A github/cards
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
