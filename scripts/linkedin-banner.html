<!doctype html>
<!-- Source of linkedin-banner.png (1584x396). Regenerate: serve the repo root, open /scripts/linkedin-banner.html
     at 1584x396 and screenshot it. The profile photo covers the bottom left, so text sits right of centre. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>LinkedIn banner</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  @font-face { font-family: Geist; font-weight: 400; src: url(../github/fonts/geist-400.sub.woff2) format("woff2"); }
  @font-face { font-family: Geist; font-weight: 600; src: url(../github/fonts/geist-600.sub.woff2) format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 500; src: url(../github/fonts/geistmono-500.sub.woff2) format("woff2"); }
  html, body { margin: 0; width: 1584px; height: 396px; overflow: hidden; background: var(--c-bg); color: var(--c-ink); font-family: Geist, system-ui, sans-serif; }
  canvas { position: absolute; inset: 0; width: 1584px; height: 396px; }
  .copy { position: absolute; left: 600px; top: 64px; width: 920px; }
  .k { margin: 0; font: 500 16px/24px "Geist Mono", monospace; color: var(--c-blue); display: flex; align-items: center; gap: 12px; }
  .k::before { content: ""; width: 10px; height: 10px; border-radius: 99px; background: var(--c-blue); box-shadow: 0 0 14px var(--c-blue); }
  h1 { margin: 16px 0 0; font-weight: 600; font-size: 48px; line-height: 52px; letter-spacing: -1.5px;
       background: linear-gradient(90deg, #FFFFFF, #9B9B9B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .roles { margin: 24px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .roles li { padding: 6px 12px; border-radius: 9999px; border: 1px solid var(--c-line); background: var(--c-surface-1); font: 500 14px/20px "Geist Mono", monospace; color: rgba(255,255,255,.85); }
  .url { position: absolute; right: 64px; bottom: 32px; margin: 0; font: 500 14px/20px "Geist Mono", monospace; color: var(--c-cyan); }
</style>
</head>
<body>
<canvas id="g" width="3168" height="792"></canvas>
<div class="copy">
  <p class="k">Ashutosh Pal Singh, security analyst</p>
  <h1>I find the errors in crypto traces, forensic timelines and alert queues.</h1>
  <ul class="roles"><li>Blockchain analytics</li><li>DFIR</li><li>Fincrime</li><li>SOC</li><li>Vulnerability management</li><li>Security research</li></ul>
</div>
<p class="url">itsashutoshpsingh.github.io/portfolio</p>
<script>
  // a still address graph on the left: three owners' clusters, one false merge, one cyan trace
  var css = getComputedStyle(document.documentElement), c = function (n) { return css.getPropertyValue(n).trim(); };
  var x = document.getElementById('g').getContext('2d'); x.scale(2, 2);
  var dust = 0; while (dust++ < 140) { x.globalAlpha = .15 + Math.random() * .25; x.fillStyle = Math.random() < .3 ? c('--c-cyan') : c('--c-blue'); x.beginPath(); x.arc(Math.random() * 1584, Math.random() * 396, .5 + Math.random(), 0, 7); x.fill(); }
  x.globalAlpha = 1;
  var A = [[120, 70], [190, 50], [240, 110], [170, 140], [300, 70], [260, 170]], B = [[380, 120], [450, 90], [470, 170], [400, 210], [520, 140]], G = [[60, 230], [130, 260], [90, 320], [190, 300]];
  function cluster(P, col, E) {
    x.strokeStyle = col; x.globalAlpha = .45; x.lineWidth = 1.2;
    E.forEach(function (e) { x.beginPath(); x.moveTo(P[e[0]][0], P[e[0]][1]); x.lineTo(P[e[1]][0], P[e[1]][1]); x.stroke(); });
    x.globalAlpha = 1; x.fillStyle = col; x.shadowColor = col; x.shadowBlur = 14;
    P.forEach(function (p) { x.beginPath(); x.arc(p[0], p[1], 5, 0, 7); x.fill(); }); x.shadowBlur = 0;
  }
  cluster(A, c('--c-blue'), [[0, 1], [1, 2], [0, 3], [1, 4], [2, 5], [3, 5], [2, 4]]);
  cluster(B, c('--c-green'), [[0, 1], [1, 2], [2, 3], [0, 3], [1, 4], [2, 4]]);
  cluster(G, c('--c-amber'), [[0, 1], [1, 2], [1, 3], [0, 2]]);
  x.lineCap = 'round'; x.shadowColor = c('--c-cyan'); x.shadowBlur = 12; x.strokeStyle = c('--c-cyan'); x.lineWidth = 2.2;
  x.beginPath(); x.moveTo(A[0][0], A[0][1]); x.lineTo(A[1][0], A[1][1]); x.lineTo(A[4][0], A[4][1]); x.lineTo(A[2][0], A[2][1]); x.stroke();
  x.setLineDash([6, 6]); x.strokeStyle = c('--c-red'); x.shadowColor = c('--c-red'); x.lineWidth = 2;
  x.beginPath(); x.moveTo(A[4][0], A[4][1]); x.lineTo(B[1][0], B[1][1]); x.stroke();
  x.setLineDash([]); x.shadowBlur = 0; x.fillStyle = c('--c-red'); x.font = '500 13px "Geist Mono", monospace'; x.fillText('false merge', 340, 72);
</script>
</body>
</html>
